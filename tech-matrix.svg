<svg width="850" height="340" viewBox="0 0 850 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>

    <!-- Card Hover Glow Gradients -->
    <linearGradient id="hoverBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    
    .section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #71717a;
      text-transform: uppercase;
    }
    .tech-name {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #e4e4e7;
      transition: fill 0.25s ease;
    }
    .tech-sub {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 9.5px;
      font-weight: 400;
      fill: #71717a;
      transition: fill 0.25s ease;
    }
    
    /* Interactive Hover Animation */
    .tech-card {
      cursor: pointer;
      transform-origin: center;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-box {
      fill: #12131a;
      stroke: #27272a;
      stroke-width: 1px;
      rx: 8px;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .icon-symbol {
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    /* Hover Effects */
    .tech-card:hover {
      transform: translateY(-4px);
    }
    .tech-card:hover .card-box {
      fill: #181924;
      stroke: url(#hoverBorderGrad);
      stroke-width: 1.5px;
      filter: drop-shadow(0 6px 12px rgba(16, 185, 129, 0.15));
    }
    .tech-card:hover .tech-name {
      fill: #ffffff;
    }
    .tech-card:hover .tech-sub {
      fill: #a1a1aa;
    }
    .tech-card:hover .icon-symbol {
      transform: scale(1.08);
      transform-origin: center;
      filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.5));
    }
  </style>

  <!-- Container Box -->
  <rect width="850" height="340" rx="12" fill="url(#matrixBg)" stroke="#27272a" stroke-width="1" />

  <!-- ================= SECTION 1: SOFTWARE ENGINEERING ================= -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" class="section-title">⚡ Full-Stack &amp; Software Engineering Mastery</text>

    <!-- Card 1: TypeScript -->
    <g class="tech-card" transform="translate(0, 14)">
      <rect width="146" height="54" class="card-box" />
      <!-- Flat TS Icon -->
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#3178C6" />
        <path d="M12.5 13.5H15.5C16.5 13.5 17 12.8 17 12C17 11.2 16.5 10.5 15.5 10.5H13.8V7H12.5V13.5ZM13.8 8.1H15.2C15.8 8.1 16.1 8.4 16.1 8.8C16.1 9.2 15.8 9.5 15.2 9.5H13.8V8.1Z" fill="white" display="none" />
        <text x="5" y="17" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="white">TS</text>
      </g>
      <text x="48" y="27" class="tech-name">TypeScript</text>
      <text x="48" y="42" class="tech-sub">Type Systems &amp; OOP</text>
    </g>

    <!-- Card 2: Next.js -->
    <g class="tech-card" transform="translate(158, 14)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <circle cx="12" cy="12" r="12" fill="#000000" stroke="#333" stroke-width="1" />
        <path d="M15 17.5L8.5 9V17.5H7V6.5H8.8L15.3 15V6.5H16.8V17.5H15Z" fill="white" />
      </g>
      <text x="48" y="27" class="tech-name">Next.js 14+</text>
      <text x="48" y="42" class="tech-sub">App Router &amp; SSR</text>
    </g>

    <!-- Card 3: React -->
    <g class="tech-card" transform="translate(316, 14)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <circle cx="12" cy="12" r="3" fill="#61DAFB" />
        <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="#61DAFB" stroke-width="1.3" />
        <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="#61DAFB" stroke-width="1.3" transform="rotate(60 12 12)" />
        <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="#61DAFB" stroke-width="1.3" transform="rotate(120 12 12)" />
      </g>
      <text x="48" y="27" class="tech-name">React</text>
      <text x="48" y="42" class="tech-sub">Modern State &amp; UI</text>
    </g>

    <!-- Card 4: Node.js / C# -->
    <g class="tech-card" transform="translate(474, 14)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#339933" />
        <path d="M12 4L19 8V16L12 20L5 16V8L12 4Z" fill="none" stroke="white" stroke-width="1.5" />
        <text x="7" y="16.5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="white">JS</text>
      </g>
      <text x="48" y="27" class="tech-name">Node / C#</text>
      <text x="48" y="42" class="tech-sub">Microservices &amp; APIs</text>
    </g>

    <!-- Card 5: PostgreSQL -->
    <g class="tech-card" transform="translate(632, 14)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#316192" />
        <!-- Database icon -->
        <ellipse cx="12" cy="8" rx="7" ry="3" fill="none" stroke="white" stroke-width="1.3" />
        <path d="M5 8V16C5 17.5 8 19 12 19C16 19 19 17.5 19 16V8" fill="none" stroke="white" stroke-width="1.3" />
        <path d="M5 12C5 13.5 8 15 12 15C16 15 19 13.5 19 12" fill="none" stroke="white" stroke-width="1.3" />
      </g>
      <text x="48" y="27" class="tech-name">PostgreSQL</text>
      <text x="48" y="42" class="tech-sub">Schema Normalization</text>
    </g>

    <!-- Row 2: Docker, Git, Tailwind -->
    <g class="tech-card" transform="translate(0, 78)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#2496ED" />
        <path d="M6 14C6 14 7 15 10 15C13 15 18 13 18 10C18 7 15 7 15 7H6V14Z" fill="white" />
        <rect x="7" y="9" width="2" height="2" fill="#2496ED" />
        <rect x="10" y="9" width="2" height="2" fill="#2496ED" />
        <rect x="13" y="9" width="2" height="2" fill="#2496ED" />
      </g>
      <text x="48" y="27" class="tech-name">Docker</text>
      <text x="48" y="42" class="tech-sub">Containerization</text>
    </g>

    <g class="tech-card" transform="translate(158, 78)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#F05032" />
        <path d="M12 4L19 11L15 15L8 8L12 4Z" fill="none" stroke="white" stroke-width="1.5" />
        <circle cx="9" cy="9" r="2" fill="white" />
        <circle cx="15" cy="15" r="2" fill="white" />
      </g>
      <text x="48" y="27" class="tech-name">Git &amp; CI/CD</text>
      <text x="48" y="42" class="tech-sub">Automated Pipelines</text>
    </g>

    <g class="tech-card" transform="translate(316, 78)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#06B6D4" />
        <path d="M7 11C7.8 7.5 10 7.5 11 9C12 10.5 14 10.5 17 8C16.2 11.5 14 11.5 13 10C12 8.5 10 8.5 7 11Z" fill="white" />
        <path d="M4 16C4.8 12.5 7 12.5 8 14C9 15.5 11 15.5 14 13C13.2 16.5 11 16.5 10 15C9 13.5 7 13.5 4 16Z" fill="white" />
      </g>
      <text x="48" y="27" class="tech-name">Tailwind CSS</text>
      <text x="48" y="42" class="tech-sub">Design Systems</text>
    </g>

    <g class="tech-card" transform="translate(474, 78)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#512BD4" />
        <text x="4.5" y="16.5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="white">.NET</text>
      </g>
      <text x="48" y="27" class="tech-name">.NET Core</text>
      <text x="48" y="42" class="tech-sub">Enterprise Backend</text>
    </g>

    <g class="tech-card" transform="translate(632, 78)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#000000" stroke="#38bdf8" stroke-width="1" />
        <text x="5" y="16.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#38bdf8">{ }</text>
      </g>
      <text x="48" y="27" class="tech-name">REST APIs</text>
      <text x="48" y="42" class="tech-sub">High Concurrency</text>
    </g>
  </g>

  <!-- ================= SECTION 2: DATA ANALYTICS & INTELLIGENCE ================= -->
  <g transform="translate(32, 190)">
    <text x="0" y="0" class="section-title">📊 Data Science, Analytics &amp; Machine Learning Mastery</text>

    <!-- Card 1: Python -->
    <g class="tech-card" transform="translate(0, 14)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#3776AB" />
        <path d="M12 4C9 4 9 5.5 9 5.5V7.5H13V8.5H6.5C4.5 8.5 4 10 4 12C4 14 5 14.5 6.5 14.5H7.5V13C7.5 11.5 8.5 11.5 10 11.5H13C14.5 11.5 15.5 10.5 15.5 9V5.5C15.5 4 14.5 4 12 4Z" fill="#FFD43B" />
        <path d="M12 20C15 20 15 18.5 15 18.5V16.5H11V15.5H17.5C19.5 15.5 20 14 20 12C20 10 19 9.5 17.5 9.5H16.5V11C16.5 12.5 15.5 12.5 14 12.5H11C9.5 12.5 8.5 13.5 8.5 15V18.5C8.5 20 9.5 20 12 20Z" fill="#3776AB" />
      </g>
      <text x="48" y="27" class="tech-name">Python</text>
      <text x="48" y="42" class="tech-sub">Data Core &amp; ML</text>
    </g>

    <!-- Card 2: SQL -->
    <g class="tech-card" transform="translate(158, 14)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#003B57" />
        <text x="4" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#38BDF8">SQL</text>
      </g>
      <text x="48" y="27" class="tech-name">Complex SQL</text>
      <text x="48" y="42" class="tech-sub">Window Funcs &amp; CTEs</text>
    </g>

    <!-- Card 3: Pandas & NumPy -->
    <g class="tech-card" transform="translate(316, 14)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#150458" />
        <path d="M7 6H10V18H7V6Z" fill="#FFD43B" />
        <path d="M14 10H17V18H14V10Z" fill="#38BDF8" />
      </g>
      <text x="48" y="27" class="tech-name">Pandas / NumPy</text>
      <text x="48" y="42" class="tech-sub">ETL &amp; Data Wrangling</text>
    </g>

    <!-- Card 4: Scikit-Learn -->
    <g class="tech-card" transform="translate(474, 14)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#F7931E" />
        <circle cx="8" cy="8" r="3" fill="white" />
        <circle cx="16" cy="12" r="3" fill="white" />
        <circle cx="9" cy="16" r="3" fill="white" />
        <line x1="8" y1="8" x2="16" y2="12" stroke="white" stroke-width="1.2" />
        <line x1="16" y1="12" x2="9" y2="16" stroke="white" stroke-width="1.2" />
      </g>
      <text x="48" y="27" class="tech-name">Scikit-Learn</text>
      <text x="48" y="42" class="tech-sub">Predictive Modeling</text>
    </g>

    <!-- Card 5: Power BI -->
    <g class="tech-card" transform="translate(632, 14)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#F2C811" />
        <rect x="7" y="13" width="2.5" height="6" fill="#1E293B" rx="1" />
        <rect x="11" y="9" width="2.5" height="10" fill="#1E293B" rx="1" />
        <rect x="15" y="6" width="2.5" height="13" fill="#1E293B" rx="1" />
      </g>
      <text x="48" y="27" class="tech-name">Power BI</text>
      <text x="48" y="42" class="tech-sub">DAX &amp; Executive BI</text>
    </g>

    <!-- Row 2: Tableau, Streamlit, BigQuery, EDA -->
    <g class="tech-card" transform="translate(0, 78)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#E97627" />
        <circle cx="12" cy="7" r="1.5" fill="white" />
        <circle cx="12" cy="17" r="1.5" fill="white" />
        <circle cx="7" cy="12" r="1.5" fill="white" />
        <circle cx="17" cy="12" r="1.5" fill="white" />
        <rect x="11" y="9" width="2" height="6" fill="white" />
        <rect x="9" y="11" width="6" height="2" fill="white" />
      </g>
      <text x="48" y="27" class="tech-name">Tableau</text>
      <text x="48" y="42" class="tech-sub">Visual Analytics</text>
    </g>

    <g class="tech-card" transform="translate(158, 78)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#FF4B4B" />
        <!-- Crown / flame icon -->
        <path d="M6 16L8 8L12 13L16 8L18 16H6Z" fill="white" />
      </g>
      <text x="48" y="27" class="tech-name">Streamlit</text>
      <text x="48" y="42" class="tech-sub">Data Applications</text>
    </g>

    <g class="tech-card" transform="translate(316, 78)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#669DF6" />
        <circle cx="11" cy="11" r="5" fill="none" stroke="white" stroke-width="1.5" />
        <line x1="15" y1="15" x2="19" y2="19" stroke="white" stroke-width="1.8" stroke-linecap="round" />
      </g>
      <text x="48" y="27" class="tech-name">Google BigQuery</text>
      <text x="48" y="42" class="tech-sub">Cloud Data Warehousing</text>
    </g>

    <g class="tech-card" transform="translate(474, 78)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#10B981" />
        <path d="M6 16L10 11L14 14L18 8" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="48" y="27" class="tech-name">Advanced EDA</text>
      <text x="48" y="42" class="tech-sub">Hypothesis Testing</text>
    </g>

    <g class="tech-card" transform="translate(632, 78)">
      <rect width="146" height="54" class="card-box" />
      <g transform="translate(14, 15)" class="icon-symbol">
        <rect width="24" height="24" rx="4" fill="#8B5CF6" />
        <circle cx="12" cy="12" r="7" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="3 2" />
        <circle cx="12" cy="12" r="3" fill="white" />
      </g>
      <text x="48" y="27" class="tech-name">Data Pipeline</text>
      <text x="48" y="42" class="tech-sub">Automated ETL &amp; Cron</text>
