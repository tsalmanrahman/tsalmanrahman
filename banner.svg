<svg width="850" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0c0d12" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="40%" stop-color="#3f3f46" />
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <radialGradient id="ambient" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif; font-weight: 700; font-size: 28px; fill: #fafafa; letter-spacing: -0.5px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif; font-weight: 500; font-size: 15px; fill: #a1a1aa; }
    .subtitle { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #10b981; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #71717a; }
    .cursor { fill: #10b981; animation: blink 1s step-start infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- Background Base -->
  <rect width="850" height="200" rx="12" fill="url(#bg)" />
  <rect width="850" height="200" rx="12" fill="url(#ambient)" />
  <rect x="0.5" y="0.5" width="849" height="199" rx="11.5" stroke="url(#border)" stroke-width="1" />

  <!-- Live Status Beacon -->
  <g transform="translate(42, 32)">
    <circle cx="5" cy="5" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="16" y="8.5" class="subtitle">AVAILABLE FOR IMPACT ROLES</text>
  </g>

  <!-- Name -->
  <text x="42" y="82" class="name">Salman Rahman</text>

  <!-- Title & Dynamic Cursor -->
  <g transform="translate(42, 110)">
    <text x="0" y="0" class="title">Software Engineer &amp; Data Analyst</text>
    <rect x="268" y="-12" width="2" height="15" class="cursor" />
  </g>

  <!-- Crisp 1-sentence value statement -->
  <text x="42" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#71717a">
    Architecting robust full-stack software and transforming enterprise data into actionable intelligence.
  </text>

  <!-- Subtle Minimal Divider -->
  <line x1="42" y1="156" x2="808" y2="156" stroke="#27272a" stroke-width="0.8" />

  <!-- Footprint Tags -->
  <g transform="translate(42, 175)">
    <text x="0" y="0" class="tag">🎓 PGD in Data Science (2024)</text>
    <circle cx="170" cy="-3.5" r="1.5" fill="#3f3f46" />
    <text x="180" y="0" class="tag">BSc in Computer Science &amp; Eng.</text>
    <circle cx="365" cy="-3.5" r="1.5" fill="#3f3f46" />
    <text x="375" y="0" class="tag">📍 Dhaka, Bangladesh</text>
  </g>
</svg>
