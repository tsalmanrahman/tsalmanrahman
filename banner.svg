<svg width="850" height="210" viewBox="0 0 850 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090d" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#09090d" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="40%" stop-color="#3f3f46" />
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <radialGradient id="ambient" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    
    .name { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 29px; fill: #ffffff; letter-spacing: -0.6px; }
    .title { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    .desc { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 12.5px; fill: #a1a1aa; }
    .badge-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #10b981; letter-spacing: 1px; }
    .pill-tag { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; fill: #cbd5e1; transition: all 0.25s ease; }
    .cursor { fill: #10b981; animation: blink 1s step-start infinite; }
    
    /* Interactive Card Hover */
    .banner-container {
      cursor: default;
    }
    .cred-pill {
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cred-pill:hover rect {
      fill: #181924;
      stroke: #38bdf8;
      stroke-width: 1.2px;
    }
    .cred-pill:hover text {
      fill: #ffffff;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- Background Base -->
  <g class="banner-container">
    <rect width="850" height="210" rx="12" fill="url(#bg)" />
    <rect width="850" height="210" rx="12" fill="url(#ambient)" />
    <rect x="0.5" y="0.5" width="849" height="209" rx="11.5" stroke="url(#border)" stroke-width="1" />

    <!-- Live Status Beacon -->
    <g transform="translate(42, 30)">
      <circle cx="5" cy="5" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="16" y="8.5" class="badge-label">AVAILABLE FOR SOFTWARE &amp; DATA ROLES</text>
    </g>

    <!-- Name -->
    <text x="42" y="82" class="name">Salman Rahman</text>

    <!-- Title & Animated Cursor -->
    <g transform="translate(42, 110)">
      <text x="0" y="0" class="title">Software Engineer &amp; Data Analyst</text>
      <rect x="272" y="-12" width="2" height="15" class="cursor" />
    </g>

    <!-- 1-sentence value statement -->
    <text x="42" y="136" class="desc">
      Architecting robust full-stack software and transforming complex enterprise data into actionable intelligence.
    </text>

    <!-- Subtle Minimal Divider -->
    <line x1="42" y1="156" x2="808" y2="156" stroke="#27272a" stroke-width="0.8" />

    <!-- Interactive Credential Pills -->
    <g transform="translate(42, 170)">
      <!-- Pill 1: PGDDS -->
      <g class="cred-pill">
        <rect width="210" height="26" rx="6" fill="#12131a" stroke="#27272a" stroke-width="1" />
        <text x="12" y="17" class="pill-tag">🎓 PGD in Data Science (2024)</text>
      </g>

      <!-- Pill 2: BSc CSE -->
      <g class="cred-pill" transform="translate(222, 0)">
        <rect width="245" height="26" rx="6" fill="#12131a" stroke="#27272a" stroke-width="1" />
        <text x="12" y="17" class="pill-tag">🎓 BSc in Computer Science &amp; Eng.</text>
      </g>

      <!-- Pill 3: Location -->
      <g class="cred-pill" transform="translate(479, 0)">
        <rect width="145" height="26" rx="6" fill="#12131a" stroke="#27272a" stroke-width="1" />
        <text x="12" y="17" class="pill-tag">📍 Dhaka, Bangladesh</text>
      </g>
    </g>
  </g>
</svg>
