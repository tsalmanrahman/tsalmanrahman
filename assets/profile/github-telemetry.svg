    <text x="24" y="64" class="metric-label">HTML</text>
    <text x="394" y="64" text-anchor="end" class="metric-val">35.3% (1,729 KB)</text>
    <rect x="24" y="71" width="370" height="6" rx="3" fill="#1e293b" />
    <rect x="24" y="71" width="130" height="6" rx="3" fill="#E34F26" />
