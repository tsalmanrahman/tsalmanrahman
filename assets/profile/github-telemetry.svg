    <text x="394" y="98" text-anchor="end" class="metric-val">23.4% (1,146 KB)</text>
    <rect x="24" y="105" width="370" height="6" rx="3" fill="#1e293b" />
    <rect x="24" y="105" width="86" height="6" rx="3" fill="#3776AB" />
