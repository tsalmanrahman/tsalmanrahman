    <text x="394" y="132" text-anchor="end" class="metric-val">22.9% (1,121 KB)</text>
    <rect x="24" y="139" width="370" height="6" rx="3" fill="#1e293b" />
    <rect x="24" y="139" width="84" height="6" rx="3" fill="#512BD4" />
    <text x="24" y="166" class="metric-label">JavaScript</text>
    <text x="394" y="166" text-anchor="end" class="metric-val">11.9% (581 KB)</text>
    <rect x="24" y="173" width="370" height="6" rx="3" fill="#1e293b" />
    <rect x="24" y="173" width="43" height="6" rx="3" fill="#F7DF1E" />
    <text x="24" y="200" class="metric-label">TSQL</text>
    <text x="394" y="200" text-anchor="end" class="metric-val">4.5% (219 KB)</text>
    <rect x="24" y="207" width="370" height="6" rx="3" fill="#1e293b" />
    <rect x="24" y="207" width="16" height="6" rx="3" fill="#CC2927" />
    <text x="24" y="234" class="metric-label">Other</text>
    <text x="394" y="234" text-anchor="end" class="metric-val">2.0% (98 KB)</text>
    <rect x="24" y="241" width="370" height="6" rx="3" fill="#1e293b" />
    <rect x="24" y="241" width="7" height="6" rx="3" fill="#64748b" />
