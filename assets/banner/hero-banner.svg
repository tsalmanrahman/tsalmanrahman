<svg width="860" height="232" viewBox="0 0 860 232" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.45" />
    </linearGradient>
    <radialGradient id="heroGlow" cx="88%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .status-text { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #10b981; letter-spacing: 0.9px; }
    .hero-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 30px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px; }
    .hero-role { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #38bdf8; }
    .hero-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #cbd5e1; }
  </style>

  <rect width="860" height="232" rx="12" fill="url(#heroBg)" />
  <rect width="860" height="232" rx="12" fill="url(#heroGlow)" />
  <rect x="0.5" y="0.5" width="859" height="231" rx="11.5" stroke="url(#heroBorder)" stroke-width="1" />

  <g transform="translate(42, 32)">
    <circle cx="5" cy="5" r="4" fill="#10b981" />
    <text x="16" y="8.5" class="status-text">OPEN TO SQL, DATA &amp; ERP BACKEND ROLES</text>
  </g>

  <text x="42" y="80" class="hero-name">Salman Rahman</text>
  <text x="42" y="108" class="hero-role">SQL Developer | Data Analyst | C# &amp; Python Enthusiast | CompTIA A+ Certified</text>
  <text x="42" y="136" class="hero-desc">Designing resilient relational databases, enterprise ERP workflows, and actionable reporting systems.</text>

  <line x1="42" y1="158" x2="818" y2="158" stroke="#1e293b" stroke-width="1" />

  <g transform="translate(42, 174)">
    <g transform="translate(0, 0)">
      <rect width="166" height="28" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <text x="83.0" y="18" text-anchor="middle" class="pill-text">CompTIA A+ Certified</text>
    </g>
    <g transform="translate(178, 0)">
      <rect width="186" height="28" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <text x="93.0" y="18" text-anchor="middle" class="pill-text">BSc in Computer Science</text>
    </g>
    <g transform="translate(376, 0)">
      <rect width="221" height="28" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <text x="110.5" y="18" text-anchor="middle" class="pill-text">SQL Server &amp; Crystal Reports</text>
    </g>
    <g transform="translate(609, 0)">
      <rect width="145" height="28" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <text x="72.5" y="18" text-anchor="middle" class="pill-text">Dhaka, Bangladesh</text>
    </g>
  </g>
</svg>
