<svg width="850" height="210" viewBox="0 0 850 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1322" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <linearGradient id="engGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <style>
    .card-title { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .metric-val { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; }
    .bar-bg { fill: #1e293b; rx: 3px; }
  </style>

  <!-- Card 1: Software Engineering Telemetry (Left) -->
  <g transform="translate(0, 0)">
    <rect width="415" height="210" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
    <!-- Glow dot -->
    <circle cx="24" cy="24" r="4" fill="#38bdf8" />
    <text x="36" y="28" fill="#38bdf8" class="card-title">ENGINEERING COMPETENCIES</text>

    <!-- Row 1: Frontend & Fullstack -->
    <text x="24" y="60" class="metric-label">Fullstack Architecture (React, Next.js, Node)</text>
    <text x="365" y="60" fill="#38bdf8" class="metric-val" text-anchor="end">95%</text>
    <rect x="24" y="68" width="365" height="5" class="bar-bg" />
    <rect x="24" y="68" width="346" height="5" fill="url(#engGrad)" rx="2.5" />

    <!-- Row 2: Relational DB & Backend -->
    <text x="24" y="96" class="metric-label">Database Design &amp; Optimization (Postgres, C#)</text>
    <text x="365" y="96" fill="#38bdf8" class="metric-val" text-anchor="end">92%</text>
    <rect x="24" y="104" width="365" height="5" class="bar-bg" />
    <rect x="24" y="104" width="335" height="5" fill="url(#engGrad)" rx="2.5" />

    <!-- Row 3: API & Systems Integration -->
    <text x="24" y="132" class="metric-label">REST APIs &amp; Enterprise System Workflows</text>
    <text x="365" y="132" fill="#38bdf8" class="metric-val" text-anchor="end">90%</text>
    <rect x="24" y="140" width="365" height="5" class="bar-bg" />
    <rect x="24" y="140" width="328" height="5" fill="url(#engGrad)" rx="2.5" />

    <!-- Badges Row -->
    <g transform="translate(24, 165)">
      <rect width="112" height="22" rx="4" fill="#1e293b" />
      <text x="56" y="15" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">⚡ High Throughput</text>

      <rect x="120" width="105" height="22" rx="4" fill="#1e293b" />
      <text x="172" y="15" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">🔒 Clean OOP / SOLID</text>

      <rect x="233" width="132" height="22" rx="4" fill="#1e293b" />
      <text x="299" y="15" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">🐳 Docker &amp; CI/CD</text>
    </g>
  </g>

  <!-- Card 2: Data Science & Analytics Telemetry (Right) -->
  <g transform="translate(435, 0)">
    <rect width="415" height="210" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
    <!-- Glow dot -->
    <circle cx="24" cy="24" r="4" fill="#34d399" />
    <text x="36" y="28" fill="#34d399" class="card-title">ANALYTICS &amp; ML INTELLIGENCE</text>

    <!-- Row 1: SQL & Data Modeling -->
    <text x="24" y="60" class="metric-label">Complex SQL (Window Funcs, CTEs, Aggregates)</text>
    <text x="365" y="60" fill="#34d399" class="metric-val" text-anchor="end">96%</text>
    <rect x="24" y="68" width="365" height="5" class="bar-bg" />
    <rect x="24" y="68" width="350" height="5" fill="url(#dataGrad)" rx="2.5" />

    <!-- Row 2: Python Data Engineering -->
    <text x="24" y="96" class="metric-label">ETL &amp; Data Manipulation (Pandas, NumPy, EDA)</text>
    <text x="365" y="96" fill="#34d399" class="metric-val" text-anchor="end">94%</text>
    <rect x="24" y="104" width="365" height="5" class="bar-bg" />
    <rect x="24" y="104" width="343" height="5" fill="url(#dataGrad)" rx="2.5" />

    <!-- Row 3: BI Dashboards & Predictive Modeling -->
    <text x="24" y="132" class="metric-label">Executive Dashboards (Power BI, Tableau, Scikit)</text>
    <text x="365" y="132" fill="#34d399" class="metric-val" text-anchor="end">88%</text>
    <rect x="24" y="140" width="365" height="5" class="bar-bg" />
    <rect x="24" y="140" width="321" height="5" fill="url(#dataGrad)" rx="2.5" />

    <!-- Badges Row -->
    <g transform="translate(24, 165)">
      <rect width="112" height="22" rx="4" fill="#1e293b" />
      <text x="56" y="15" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">📈 Churn Modeling</text>

      <rect x="120" width="115" height="22" rx="4" fill="#1e293b" />
      <text x="177" y="15" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">🧪 Statistical Testing</text>

      <rect x="243" width="122" height="22" rx="4" fill="#1e293b" />
      <text x="304" y="15" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">☁️ BigQuery / Cloud</text>
    </g>
  </g>
</svg>
